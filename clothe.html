<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>     
</head>
<body>
    <main class="h-screen flex justify-center items-center box-border">
        <section class="border border-neutral-900 rounded-2xl">
            <div class="p-5 rounded-t-2xl group" id="imageContainer">
                <img src="public/camisa.png" alt="camisa" class="group-hover:scale-105 duration-700">

            </div>  
            <div class="flex justify-between items-center border-t border-neutral-900 bg-gray-950 rounded-b-2xl text-white">
                <div class="m-4">
                    <p class="font-bold text-lg">$ 12.99</p>
                </div>
                <div class="m-4 flex gap-2">
                    <button class="w-10 h-10 border border-neutral-900 rounded-full bg-sky-300" data-color="sky"></button>
                    <button class="w-10 h-10 border border-neutral-900 rounded-full bg-red-300" data-color="red"></button>
                    <button class="w-10 h-10 border border-neutral-900 rounded-full bg-white" data-color="white"></button>
                </div>
            </div>
        </section>
    </main>
        <script>

        const container = document.getElementById("imageContainer");
        const buttons = document.querySelectorAll("button");

        buttons.forEach(button => {

            button.addEventListener("click", () => {

                const color = button.dataset.color;

                if (color === "sky") {
                    container.style.backgroundColor = "#7dd3fc";
                }

                if (color === "red") {
                    container.style.backgroundColor = "#fca5a5";
                }

                if (color === "white") {
                    container.style.backgroundColor = "#ffffff";
                }

            });

        });

    </script>
</body>
</html>
